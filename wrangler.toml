# Cloudflare Pages — configuracao do projeto
# Este arquivo e usado para deploy via CLI (wrangler) ou GitHub Actions.
# No painel do Cloudflare Pages, configure as variaveis de ambiente manualmente.

name = "loja-top-mix"
compatibility_date = "2024-01-01"
pages_build_output_dir = "dist/public"

# ──────────────────────────────────────────────────────────────
# KV NAMESPACE — Rate limit por IP no /api/pix/create
# Passos para criar:
#   1. Acesse: Cloudflare Dashboard → Workers & Pages → KV
#   2. Clique em "Create namespace" → nome: pix-ratelimit
#   3. Copie o "Namespace ID" gerado
#   4. Cole no campo id abaixo
#   5. No painel do seu Pages: Settings → Functions → KV namespace bindings
#      → Add binding: Variable name = PIX_RATELIMIT, namespace = pix-ratelimit
# ──────────────────────────────────────────────────────────────
[[kv_namespaces]]
binding = "PIX_RATELIMIT"
id      = "44122051ba9a4c83a7d09019a3671894"

# Variaveis de ambiente (configure os VALORES no painel do Cloudflare Pages)
# Settings -> Environment variables -> Add variable
#
# Producao (Production):
#   IRONPAY_API_TOKEN
#   IRONPAY_OFFER_HASH
#   IRONPAY_PRODUCT_HASH
#   MASTERFY_API_KEY          <- chave Bearer da conta MasterFy (PIX alternativo)
#   UMBRELLAPAG_API_KEY       <- chave x-api-key da conta UmbrellaPag (PIX alternativo)
#   VENUS_PAY_SECRET_KEY      <- chave Venus Pay (serve para cartão E PIX)
#   VENUS_PAY_PRODUCT_ID
#   ADMIN_USER
#   ADMIN_PASS
#   ADMIN_SESSION_SECRET
#   SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY
#   VITE_SUPABASE_URL
#   VITE_SUPABASE_KEY
#   VITE_ENCRYPT_KEY
#   VITE_GTM_ID               <- ID público do Google Tag Manager da Bella Mix
#   VITE_GA_ID                <- ID público do Google Analytics 4 da Bella Mix
#   VITE_UTMIFY_PIXEL_ID      <- ID público do pixel UTMify da Bella Mix
#   UTMIFY_API_TOKEN
#   FB_PIXEL_ID
#   FB_ACCESS_TOKEN
#   RESEND_API_KEY
#   RESEND_FROM_EMAIL
#   SITE_URL             <- URL do seu site (ex: https://loja-top-mix.pages.dev)
#   CRON_SECRET          <- segredo opcional para proteger /api/process-recovery-queue
